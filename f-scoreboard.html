<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper A · F tier scoreboard</title><style>body{font:16px/1.6 system-ui;color:#17313b;background:#f5f7f6;margin:0}main{max-width:1200px;margin:40px auto;padding:0 20px}h1{font-size:40px;line-height:1.2}.summary{font-size:24px;color:#176f77}a{color:#096c79}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:14px;text-align:left;border-bottom:1px solid #dce3e3;vertical-align:top}th{background:#17313b;color:white}.F_PASS{color:#146e4b;font-weight:bold}.BLOCKED{color:#a44525}.RUNNING{color:#1756a0}td:first-child{white-space:nowrap}details{font-size:14px}.small{font-size:14px;color:#586e76}</style><main><a href="reproduction.html">Paper A</a> / <a href="full-reproduction.html">历史 O 级与失败记录</a><h1>两篇工作 · 仿真功能复现</h1><p>F 级：复现可观测功能，并公开配置差异。原作代码、硬件、私有数据一致性单独记录为 O 级；不阻塞当前仿真实验。</p><p class="summary" id="counts">加载 36 项…</p><p class="small" id="stamp"></p><div class="wrap"><table><thead><tr><th>项目</th><th>状态</th><th>F 级最小验收（本地阈值）</th><th>证据 / 视频 / 差异</th></tr></thead><tbody id="rows"></tbody></table></div><p class="small">MATTERIX 世界与时钟由 Isaac Lab 所有，液体采用 PhysX PBD。Auto 的 MuJoCo + Warp DFSPH 是 A01 独立实验。数据本地每 15 分钟刷新，网站每日或每新增 3 项 F_PASS 集中发布。</p></main><script>const E=(tag,text)=>{let e=document.createElement(tag);e.textContent=text;return e};fetch('data/f-tier-scoreboard.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{document.querySelector('#counts').textContent=`${d.rows.filter(x=>x.status==='F_PASS').length} / 36 F_PASS`;document.querySelector('#stamp').textContent='更新：'+d.updated_at_utc+' · O 级完整复现尚未完成';for(let r of d.rows){let tr=E('tr',''),id=E('td',r.id),st=E('td',r.status),ac=E('td',''),ev=E('td','');st.className=r.status;ac.append(E('strong',r.title));let ol=E('ol','');for(let x of r.F_minimum_acceptance)ol.append(E('li',x));ac.append(ol);if(r.video){let a=E('a','▶ 视频');a.href=r.video.startsWith('http')?r.video:r.video.replace('../../github-pages/papera-full-reproduction/','');ev.append(a)}for(let p of r.evidence_paths)ev.append(E('p',p));let de=E('details','');de.append(E('summary','配置差异 / O 级缺口'));de.append(E('p',r.declared_differences.join('; ')));de.append(E('p',r.O_level.reason));ev.append(de);tr.append(id,st,ac,ev);document.querySelector('#rows').append(tr)}}).catch(e=>document.querySelector('#counts').textContent='读取失败：'+e.message)</script></html>
